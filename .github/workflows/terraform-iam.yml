name: GCP SOT Terraform

on:
  pull_request:
    branches: [main]
    paths: ["sot/**", "*.tf", "scripts/**", ".github/workflows/terraform-iam.yml"]
  push:
    branches: [main]
    paths: ["sot/**", "*.tf", "scripts/**", ".github/workflows/terraform-iam.yml"]

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_roles.py
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.PLAN_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform init
      - name: Terraform plan
        run: |
          terraform plan -no-color -out=tfplan \
            -var-file=sot/firwall.json \
            -var-file=sot/gke_workload_identities.auto.tfvars.json \
            -var-file=sot/projec_apis.auto.tfvars.json \
            -var-file=sot/project_roles.auto.tfvars.json \
            -var-file=sot/service_account_roles.auto.tfvars.json \
            -var-file=sot/shared_vpc_users.auto.tfvars.json
      - if: always()
        run: |
          if [ -f tfplan ]; then terraform show -no-color tfplan > plan.txt; fi
          { echo "## Terraform plan"; [ -f plan.txt ] && cat plan.txt; } >> "$GITHUB_STEP_SUMMARY"
      - if: always() && hashFiles('plan.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: plan.txt
          retention-days: 7

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: gcp-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.APPLY_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform init
      - name: Plan and apply merged configuration
        run: |
          terraform plan -out=tfplan \
            -var-file=sot/firwall.json \
            -var-file=sot/gke_workload_identities.auto.tfvars.json \
            -var-file=sot/projec_apis.auto.tfvars.json \
            -var-file=sot/project_roles.auto.tfvars.json \
            -var-file=sot/service_account_roles.auto.tfvars.json \
            -var-file=sot/shared_vpc_users.auto.tfvars.json
          terraform apply -auto-approve tfplan
